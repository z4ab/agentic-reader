name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sidecar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
